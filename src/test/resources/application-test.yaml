spring:
  datasource:
    url: jdbc:h2:mem:merkon-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    # H2 exposes its built-in public schema as the physical identifier PUBLIC.
    default-schema: PUBLIC
    schemas:
      - PUBLIC
    locations: classpath:db/migration/{vendor}
  autoconfigure:
    exclude:
      - dev.langchain4j.ollama.spring.OllamaAutoConfiguration

whatsapp:
  api-token: test-token
  phone-number-id: test-phone-number-id
  verify-token: test-verify-token
  graph-api-version: v19.0

storage:
  receipts-directory: target/test-receipts
  public-upload-directory: target/test-uploads

rag:
  embedding-store:
    table: menu_embeddings
    dimension: 768
  retrieval:
    max-results: 15
    min-score: 0.0
  memory:
    max-messages: 20
merkon:
  vendis-import:
    enabled: false
    dry-run: true
  security:
    jwt:
      key-id: test-key
      issuer: urn:merkon:test-auth
      audience: urn:merkon:test-api
      access-token-ttl: 15m
    session-ttl: 15d
    bcrypt-strength: 4
  transactional-email:
    provider: DISABLED
    enabled: false
    from-address: no-reply@merkon.invalid
    from-name: MerkON Test
    verification-base-url: https://verification.merkon.invalid/verify-email
    password-reset-base-url: https://password-reset.merkon.invalid/reset-password
    support-address: support@merkon.invalid
    resend-api-base-url: https://api.resend.com
    connect-timeout: 1s
    read-timeout: 1s
