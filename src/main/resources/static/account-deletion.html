<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MerkON | Eliminación de cuenta</title>
  <style>
    body { font-family: system-ui; max-width: 42rem; margin: 3rem auto; padding: 1rem; color: #18212b; }
    button, input { font: inherit; padding: .7rem; margin: .3rem 0; width: 100%; box-sizing: border-box; }
    button { background: #176b58; color: white; border: 0; border-radius: .3rem; }
  </style>
</head>
<body>
  <h1>MerkON</h1>
  <p><strong>Cardovia — Eliminación de cuenta y datos</strong></p>
  <p>Ingresa el correo asociado a tu cuenta. Si existe una cuenta elegible, recibirás un enlace de confirmación. Abrir el enlace no elimina nada: deberás confirmarlo explícitamente.</p>
  <form id="request">
    <input id="email" type="email" required placeholder="correo@ejemplo.com">
    <button>Solicitar eliminación</button>
  </form>
  <p id="message" role="status"></p>
  <section id="confirm" hidden>
    <p>Confirma que deseas eliminar la cuenta y sus datos asociados.</p>
    <button id="confirmButton">Confirmar eliminación</button>
  </section>
  <script>
    const message = document.querySelector('#message');
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    const confirmation = document.querySelector('#confirm');

    if (token) confirmation.hidden = false;

    async function responseBody(response) {
      try { return await response.json(); } catch (_) { return null; }
    }

    document.querySelector('#request').onsubmit = async event => {
      event.preventDefault();
      const response = await fetch('/api/v1/account-deletion/request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: document.querySelector('#email').value})
      });
      message.textContent = response.ok
        ? 'Solicitud aceptada. Revisa tu correo si la cuenta requiere confirmación.'
        : 'No fue posible procesar la solicitud.';
    };

    document.querySelector('#confirmButton').onclick = async () => {
      const response = await fetch('/api/v1/account-deletion/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token})
      });
      const error = response.status === 409 ? await responseBody(response) : null;
      if (response.status === 204) {
        message.textContent = 'La eliminación fue completada.';
      } else if (error && error.code === 'ACCOUNT_DELETION_LAST_OWNER_ACTION_REQUIRED') {
        message.textContent = 'Debes transferir la propiedad o eliminar el negocio desde MerkON antes de continuar.';
      } else if (error && error.code === 'ACCOUNT_DELETION_ACTION_REQUIRED') {
        message.textContent = 'La cuenta requiere una acción adicional antes de poder eliminarse automáticamente.';
      } else {
        message.textContent = 'El enlace no es válido o venció.';
      }
      confirmation.hidden = true;
    };
  </script>
</body>
</html>
