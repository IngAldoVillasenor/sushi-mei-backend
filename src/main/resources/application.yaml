spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    default-schema: public
    schemas:
      - public
    locations: classpath:db/migration/{vendor}

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1}
      temperature: 0.3
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

whatsapp:
  api-token: ${WHATSAPP_API_TOKEN}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v19.0}

storage:
  receipts-directory: ${RECEIPTS_DIRECTORY}
  public-upload-directory: ${PUBLIC_UPLOAD_DIRECTORY}

rag:
  embedding-store:
    table: ${RAG_TABLE:menu_embeddings}
    dimension: ${RAG_DIMENSION:768}
  retrieval:
    max-results: ${RAG_MAX_RESULTS:15}
    min-score: ${RAG_MIN_SCORE:0.0}
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

server:
  address: 0.0.0.0
  port: ${PORT:8080}

development:
  ai-harness:
    enabled: ${DEV_AI_HARNESS_ENABLED:false}
merkon:
  vendis-import:
    enabled: ${MERKON_VENDIS_IMPORT_ENABLED:${SUSHIMEI_VENDIS_IMPORT_ENABLED:false}}
    file: ${MERKON_VENDIS_IMPORT_FILE:${SUSHIMEI_VENDIS_IMPORT_FILE:}}
    dry-run: ${MERKON_VENDIS_IMPORT_DRY_RUN:${SUSHIMEI_VENDIS_IMPORT_DRY_RUN:true}}
  security:
    jwt:
      private-key-location: ${MERKON_JWT_PRIVATE_KEY_LOCATION:${SUSHIMEI_JWT_PRIVATE_KEY_LOCATION:}}
      public-key-location: ${MERKON_JWT_PUBLIC_KEY_LOCATION:${SUSHIMEI_JWT_PUBLIC_KEY_LOCATION:}}
      key-id: ${MERKON_JWT_KEY_ID:${SUSHIMEI_JWT_KEY_ID:merkon-primary}}
      issuer: ${MERKON_JWT_ISSUER:${SUSHIMEI_JWT_ISSUER:urn:merkon:auth}}
      audience: ${MERKON_JWT_AUDIENCE:${SUSHIMEI_JWT_AUDIENCE:urn:merkon:api}}
      access-token-ttl: ${MERKON_JWT_ACCESS_TOKEN_TTL:${SUSHIMEI_JWT_ACCESS_TOKEN_TTL:15m}}
    session-ttl: ${MERKON_SESSION_TTL:${SUSHIMEI_SESSION_TTL:15d}}
    bcrypt-strength: ${MERKON_BCRYPT_STRENGTH:${SUSHIMEI_BCRYPT_STRENGTH:12}}
    bootstrap-owner-username: ${MERKON_BOOTSTRAP_OWNER_USERNAME:${SUSHIMEI_BOOTSTRAP_OWNER_USERNAME:}}
    bootstrap-owner-password: ${MERKON_BOOTSTRAP_OWNER_PASSWORD:${SUSHIMEI_BOOTSTRAP_OWNER_PASSWORD:}}
    bootstrap-owner-display-name: ${MERKON_BOOTSTRAP_OWNER_DISPLAY_NAME:${SUSHIMEI_BOOTSTRAP_OWNER_DISPLAY_NAME:Owner}}
  registration:
    terms-version: ${MERKON_REGISTRATION_TERMS_VERSION:v1}
    rate-limit-max-attempts: ${MERKON_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:5}
    rate-limit-window: ${MERKON_REGISTRATION_RATE_LIMIT_WINDOW:15m}
    # The socket peer is intentionally treated only as a coarse safety bucket:
    # Cloud Run does not establish client-IP provenance for forwarded headers.
    transport-rate-limit-max-attempts: ${MERKON_REGISTRATION_TRANSPORT_RATE_LIMIT_MAX_ATTEMPTS:500}
  email-verification:
    token-ttl: ${MERKON_EMAIL_VERIFICATION_TOKEN_TTL:24h}
    resend-rate-limit-max-attempts: ${MERKON_EMAIL_VERIFICATION_RESEND_RATE_LIMIT_MAX_ATTEMPTS:5}
    resend-rate-limit-window: ${MERKON_EMAIL_VERIFICATION_RESEND_RATE_LIMIT_WINDOW:15m}
    # Socket peers are intentionally only a coarse volume guard. Forwarded
    # client IP headers have no configured trusted-proxy provenance in Cloud Run.
    transport-rate-limit-max-attempts: ${MERKON_EMAIL_VERIFICATION_TRANSPORT_RATE_LIMIT_MAX_ATTEMPTS:500}
    transport-rate-limit-window: ${MERKON_EMAIL_VERIFICATION_TRANSPORT_RATE_LIMIT_WINDOW:15m}
  transactional-email:
    # Disabled by default: production must explicitly configure Resend and a verified sender.
    provider: ${MERKON_TRANSACTIONAL_EMAIL_PROVIDER:DISABLED}
    enabled: ${MERKON_TRANSACTIONAL_EMAIL_ENABLED:false}
    api-key: ${MERKON_TRANSACTIONAL_EMAIL_API_KEY:}
    from-address: ${MERKON_TRANSACTIONAL_EMAIL_FROM_ADDRESS:no-reply@merkon.invalid}
    from-name: ${MERKON_TRANSACTIONAL_EMAIL_FROM_NAME:MerkON}
    verification-base-url: ${MERKON_EMAIL_VERIFICATION_BASE_URL:https://verification.merkon.invalid/verify-email}
    support-address: ${MERKON_TRANSACTIONAL_EMAIL_SUPPORT_ADDRESS:support@merkon.invalid}
    resend-api-base-url: ${MERKON_RESEND_API_BASE_URL:https://api.resend.com}
    connect-timeout: ${MERKON_TRANSACTIONAL_EMAIL_CONNECT_TIMEOUT:5s}
    read-timeout: ${MERKON_TRANSACTIONAL_EMAIL_READ_TIMEOUT:10s}
