spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    default-schema: public
    schemas:
      - public
    locations: classpath:db/migration/{vendor}

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1}
      temperature: 0.3
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

whatsapp:
  api-token: ${WHATSAPP_API_TOKEN}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v19.0}

storage:
  receipts-directory: ${RECEIPTS_DIRECTORY}
  public-upload-directory: ${PUBLIC_UPLOAD_DIRECTORY}

rag:
  embedding-store:
    table: ${RAG_TABLE:menu_embeddings}
    dimension: ${RAG_DIMENSION:768}
  retrieval:
    max-results: ${RAG_MAX_RESULTS:15}
    min-score: ${RAG_MIN_SCORE:0.0}
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

server:
  address: 0.0.0.0

development:
  ai-harness:
    enabled: ${DEV_AI_HARNESS_ENABLED:false}
sushimei:
  security:
    jwt:
      private-key-location: ${SUSHIMEI_JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${SUSHIMEI_JWT_PUBLIC_KEY_LOCATION:}
      key-id: ${SUSHIMEI_JWT_KEY_ID:sushi-mei-primary}
      issuer: ${SUSHIMEI_JWT_ISSUER:urn:sushi-mei:auth}
      audience: ${SUSHIMEI_JWT_AUDIENCE:urn:sushi-mei:api}
      access-token-ttl: ${SUSHIMEI_JWT_ACCESS_TOKEN_TTL:15m}
    session-ttl: ${SUSHIMEI_SESSION_TTL:15d}
    bcrypt-strength: ${SUSHIMEI_BCRYPT_STRENGTH:12}
    bootstrap-owner-username: ${SUSHIMEI_BOOTSTRAP_OWNER_USERNAME:}
    bootstrap-owner-password: ${SUSHIMEI_BOOTSTRAP_OWNER_PASSWORD:}
    bootstrap-owner-display-name: ${SUSHIMEI_BOOTSTRAP_OWNER_DISPLAY_NAME:Owner}