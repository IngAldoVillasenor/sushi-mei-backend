name: Maven tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'refactor/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw clean test
